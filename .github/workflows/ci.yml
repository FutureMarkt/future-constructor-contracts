name: CI

on:
  push:
    branches: [main, develop, dev]
  pull_request:
    branches: [main, develop, dev]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Solhint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile and test
        run: npm test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Coverage
        run: npm run coverage

  static-analysis:
    name: Slither and Aderyn
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install solc 0.8.20 and Slither
        run: |
          pip install solc-select slither-analyzer
          solc-select install 0.8.20
          solc-select use 0.8.20

      - name: Run Slither
        run: |
          slither . \
            --exclude-dependencies \
            --filter-paths "node_modules|contracts/mocks" \
            --fail-none \
            --json slither-report.json

      # Official Aderyn binaries were withdrawn (installer exits 1).
      # Build the last tagged source instead.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Aderyn from tag aderyn-v0.6.8
        run: cargo install aderyn --git https://github.com/Cyfrin/aderyn.git --tag aderyn-v0.6.8 --locked

      - name: Run Aderyn
        run: aderyn . --output aderyn-report.md

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis
          path: |
            slither-report.json
            aderyn-report.md
