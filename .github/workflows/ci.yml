name: CI

on:
  push:
    branches: [main, develop, dev]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Solhint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile and test
        run: npm test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Coverage
        run: npm run coverage

  static-analysis:
    name: Slither and Aderyn
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install solc 0.8.20 and Slither
        run: |
          pip install solc-select slither-analyzer
          solc-select install 0.8.20
          solc-select use 0.8.20

      # One Hardhat compilation pulls in OpenZeppelin 5.4.0 and 5.7.0.
      # Slither 0.11.6 crashes on the mixed source maps (crytic-compile
      # KeyError). Compile each generation with solc on its own.
      - name: Run Slither
        run: |
          slither contracts/TokenFactory.sol \
            --compile-force-framework solc \
            --solc-remaps "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/" \
            --solc-args "--optimize --optimize-runs 200 --evm-version shanghai" \
            --exclude-dependencies \
            --fail-none \
            --json slither-token-factory.json
          slither contracts/advanced/AdvancedTaxToken.sol \
            --compile-force-framework solc \
            --solc-remaps "@openzeppelin/contracts-v5.7/=node_modules/@openzeppelin/contracts-v5.7/" \
            --solc-args "--optimize --optimize-runs 200 --evm-version shanghai" \
            --exclude-dependencies \
            --fail-none \
            --json slither-advanced-tax.json

      # Official Aderyn binaries were withdrawn (installer exits 1).
      # Tag aderyn-v0.6.8 still has #![feature] in aderyn_driver, so it
      # builds only on nightly. The feature itself has been stable since 1.98.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Aderyn from tag aderyn-v0.6.8
        run: cargo install aderyn --git https://github.com/Cyfrin/aderyn.git --tag aderyn-v0.6.8 --locked

      - name: Run Aderyn
        run: aderyn . --output aderyn-report.md

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis
          path: |
            slither-token-factory.json
            slither-advanced-tax.json
            aderyn-report.md
